services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ringtrace-falkordb
    ports:
      - "6379:6379"   # Redis/FalkorDB protocol
      - "3000:3000"   # FalkorDB browser UI (optional, handy for judges to poke at the raw graph)
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  ringtrace:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ringtrace-app
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-ringtrace}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOOL_ITERATIONS: ${LLM_MAX_TOOL_ITERATIONS:-8}
      RING_COUNT: ${RING_COUNT:-5}
      ACCOUNTS_PER_RING: ${ACCOUNTS_PER_RING:-8}
      LEGIT_PERSON_COUNT: ${LEGIT_PERSON_COUNT:-150}
      NORMAL_TRANSACTION_COUNT: ${NORMAL_TRANSACTION_COUNT:-900}
      NOISE_LEVEL: ${NOISE_LEVEL:-0.08}
      FRAUD_RATIO: ${FRAUD_RATIO:-0.12}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      RINGTRACE_LOG_LEVEL: ${RINGTRACE_LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    volumes:
      - ./reports:/app/reports

volumes:
  falkordb_data:
